<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bellebrume - test collage calme</title><link rel="stylesheet" href="test.css"><link rel="stylesheet" href="sequence.css"></head><body>
<main class="stage">
  <img class="background" src="assets/background-clean.png" alt="Bellebrume au crépuscule">
  <header><small>TEST DE SCÈNE - non publié</small><h1>Belle<span>brume</span></h1><p>Quelqu’un ouvre la fenêtre.</p></header>
  <button class="window" aria-label="Regarder la personne à la fenêtre"><img class="window-left" src="assets/window-person.png" alt=""><img class="window-center" src="assets/window-person.png" alt=""><img class="window-right" src="assets/window-person.png" alt=""></button>
  <div class="laundry" aria-hidden="true"><img class="line" src="assets/laundry.png" alt=""><img class="cloth cloth-one" src="assets/laundry.png" alt=""><img class="cloth cloth-two" src="assets/laundry.png" alt=""><img class="cloth cloth-three" src="assets/laundry.png" alt=""></div>
  <div class="baker-worker" aria-label="La boulangère travaille avec ses mains"></div>
  <div class="walking-woman" aria-label="Une femme traverse la rue avec des baguettes"></div>
  <img class="plant" src="assets/window-plant.png" alt="Une plante sur le rebord de la fenêtre">
  <button class="door-way" aria-label="Suivre la porte éclairée vers Bellebrume"></button>
  <img class="foreground-wall" src="assets/foreground-wall.png" alt="">
  <button class="falling-note" aria-label="Ouvrir le papier tombé de la fenêtre"></button>
  <p class="whisper" role="status">Elle te voit. Puis elle referme les volets.</p>
</main><script src="test.js"></script></body></html>
