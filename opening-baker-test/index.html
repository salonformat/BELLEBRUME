<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bellebrume — écran d’ouverture</title>
  <link rel="stylesheet" href="opening.css?v=9">
  <style>
    .door-ready .door-sensor{pointer-events:auto;cursor:pointer}
    .door-hint{position:absolute;z-index:11;left:47.2%;top:82.4%;padding:7px 10px;color:#fff4d6;background:rgba(31,47,67,.88);box-shadow:3px 4px 0 rgba(232,195,92,.42);font:italic clamp(12px,.9vw,16px)/1.2 "Della Respira",Georgia,serif;opacity:0;transform:translateY(8px) rotate(-1deg);transition:opacity .8s ease,transform .8s ease;pointer-events:none;white-space:nowrap}
    .door-ready .door-hint{opacity:.98;transform:translateY(0) rotate(-1deg);animation:hintBreathe 2.8s ease-in-out 1.1s infinite}
    .door-ready .bakery-door:before{content:"";position:absolute;z-index:-1;left:-90%;top:24%;width:280%;height:90%;border-radius:50%;background:radial-gradient(ellipse,rgba(255,226,132,.82),rgba(255,203,83,.3) 38%,transparent 72%);filter:blur(9px);opacity:0;animation:doorBeacon 2.5s ease-in-out infinite}
    .door-open .bakery-door i{box-shadow:9px 0 22px 7px rgba(255,212,105,.72)}
    .door-ready .bakery-door:after{opacity:1;animation:handleCall 1.45s ease-in-out infinite}
    @keyframes doorBeacon{0%,100%{opacity:.25;transform:scale(.88)}50%{opacity:.95;transform:scale(1.08)}}
    @keyframes handleCall{0%,100%{opacity:.35;transform:scale(.7);box-shadow:0 0 5px rgba(255,239,180,.7)}45%{opacity:1;transform:scale(1.7);box-shadow:0 0 16px 7px rgba(255,225,127,.95)}}
    @keyframes hintBreathe{0%,100%{box-shadow:3px 4px 0 rgba(232,195,92,.32)}50%{box-shadow:3px 4px 0 rgba(232,195,92,.75)}}
  </style>
</head>
<body>
  <main class="opening" aria-label="Bellebrume au crépuscule">
    <img class="village" src="../experience-v1/assets/screen-01-animated-base.png" alt="Le village de Bellebrume au crépuscule">
    <div class="window-light window-light-one" aria-hidden="true"></div>
    <div class="window-light window-light-two" aria-hidden="true"></div>
    <div class="window-light window-light-left" aria-hidden="true"></div>
    <div class="window-shadow" aria-hidden="true"><i></i></div>
    <div class="doorway-shadows" aria-hidden="true"><i></i><i></i></div>
    <div class="bakery-door" aria-hidden="true"><i></i></div>
    <div class="door-hint" aria-hidden="true">La porte vient de s’entrouvrir&nbsp;→</div>
    <button class="door-sensor" aria-label="S’approcher de la porte de la boulangerie"></button>
    <canvas class="wind-particles" aria-hidden="true"></canvas>
    <section class="copy">
      <h1>Belle<span>brume</span></h1>
      <p>Quelque part, après le dernier virage.</p>
      <em>Le village ne reçoit jamais deux fois<br>la même personne.</em>
    </section>
    <div class="grain" aria-hidden="true"></div>
  </main>
  <script src="opening.js?v=11"></script>
</body>
</html>
